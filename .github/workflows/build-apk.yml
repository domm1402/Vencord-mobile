name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.15.0 --activate
      - name: Build official Vencord web client bundle
        run: |
          git clone --depth 1 https://github.com/Vendicated/Vencord.git vencord-src
          cd vencord-src
          pnpm install --frozen-lockfile
          pnpm buildWeb --standalone --skip-extension
          cd ..
          mkdir -p app/src/main/assets
          cp vencord-src/dist/Vencord.user.js app/src/main/assets/vencord.user.js
          cp vencord-src/LICENSE app/src/main/assets/VENCORD-LICENSE.txt
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: NEXORA-2.0-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk

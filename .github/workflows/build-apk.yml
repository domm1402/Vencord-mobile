name: Build Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
concurrency:
  group: nexora-android-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.15.0 --activate
      - name: Build pinned official Vencord web client bundle
        env:
          VENCORD_COMMIT: d07030c0968e31e41caa0c35fda0ef8ae63a079e
        run: |
          git init vencord-src
          git -C vencord-src remote add origin https://github.com/Vendicated/Vencord.git
          git -C vencord-src fetch --depth 1 origin "$VENCORD_COMMIT"
          git -C vencord-src checkout --detach FETCH_HEAD
          echo "Building Vencord commit: $(git -C vencord-src rev-parse HEAD)"
          cd vencord-src
          pnpm install --frozen-lockfile
          pnpm buildWeb --standalone --skip-extension
          cd ..
          mkdir -p app/src/main/assets
          cp vencord-src/dist/Vencord.user.js app/src/main/assets/vencord.user.js
          cp vencord-src/LICENSE app/src/main/assets/VENCORD-LICENSE.txt
      - name: Bundle offline Ace editor for the developer workspace
        run: |
          npm pack ace-builds@1.43.3
          mkdir -p app/src/main/assets/ace
          tar -xzf ace-builds-1.43.3.tgz --strip-components=2 -C app/src/main/assets/ace package/src-min-noconflict
          rm ace-builds-1.43.3.tgz
      - name: Bundle full Unicode Noto CJK font for multilingual chat
        run: |
          mkdir -p app/src/main/assets/fonts
          curl --fail --location --retry 3 https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/OTC/NotoSansCJK-Regular.ttc -o app/src/main/assets/fonts/NotoSansCJK-Regular.ttc
          curl --fail --location --retry 3 https://raw.githubusercontent.com/notofonts/noto-cjk/main/LICENSE -o app/src/main/assets/fonts/NOTO-CJK-LICENSE.txt
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Run security unit tests
        run: gradle testDebugUnitTest
      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NEXORA-unit-test-reports
          path: app/build/test-results/testDebugUnitTest/*.xml
          if-no-files-found: ignore
      - name: Build debug APK
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: NEXORA-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
